# One-click deploy: https://dashboard.render.com → New → Blueprint.
# Free web service sleeps after 15 minutes. Free Postgres expires 30 days after creation.
services:
  - type: web
    name: fapi-orders
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/products
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: fapi-orders-db
          property: connectionString

databases:
  - name: fapi-orders-db
    plan: free
    region: frankfurt
    databaseName: fapi_orders
    postgresMajorVersion: "16"
